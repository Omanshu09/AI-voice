services:
  - type: web
    name: snapdeal-virtual-kam-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
